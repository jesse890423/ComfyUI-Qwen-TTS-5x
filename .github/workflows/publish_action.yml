name: Publish to Comfy registry

# Publishing to the Comfy Registry needs a publisher account on
# https://registry.comfy.org/ and a REGISTRY_ACCESS_TOKEN secret in this
# repository. Until that exists every run would fail, so the job is skipped
# instead. To enable it:
#   1. Sign in at registry.comfy.org, create a publisher and an API key
#   2. Settings -> Secrets and variables -> Actions -> New repository secret
#      Name: REGISTRY_ACCESS_TOKEN   Value: that API key
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    # Skip rather than fail when no token is configured. A fork stays usable
    # from its GitHub URL and via Manager's git-clone install without ever
    # being published to the registry.
    if: ${{ secrets.REGISTRY_ACCESS_TOKEN != '' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
